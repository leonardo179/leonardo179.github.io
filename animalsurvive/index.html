      @keyframes flutua { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }
      #ld-box { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(78vw, 560px); z-index: 2; text-align: center; }
      #ld-bar { position: relative; height: 26px; border-radius: 14px; padding: 4px; box-sizing: border-box;
        background: linear-gradient(#5a3a1c, #3b2410); border: 2px solid #e2b04a;
        box-shadow: 0 4px 0 #2a1708, 0 8px 18px rgba(0,0,0,.5), inset 0 2px 4px rgba(0,0,0,.6); }
      #ld-fill { height: 100%; width: 0%; border-radius: 9px; transition: width .2s ease-out;
        background: linear-gradient(#ffe57a, #ffc021 55%, #f39a10); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 0 10px rgba(255,200,40,.6); }
      #ld-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
        color: #fff; text-shadow: 0 1px 0 #3b2410, 0 0 4px #3b2410; letter-spacing: .5px; }
      #ld-tip { margin-top: 12px; font-size: clamp(13px, 1.9vh, 17px); font-weight: 600; color: #fff3cf; text-shadow: 0 2px 3px rgba(0,0,0,.9);
        min-height: 1.4em; transition: opacity .35s; }
      #ld-tip b { color: #ffd54f; }
      #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #120d1e; z-index: 10; text-align: center; padding: 24px; box-sizing: border-box; font-size: 20px; }
      /* 22/11: celular desenhado (moldura dourada, tela verde) girando para a horizontal -- igual ao aviso do Animal Battle */
      #rotate { background: radial-gradient(circle at 50% 40%, #2c2040 0%, #120d1e 70%); font-weight: 700; color: #fff; }
      #rotate .ico { width: 62px; height: 104px; border: 4px solid #ffd54f; border-radius: 12px; background: #2a2140; position: relative;
        box-shadow: 0 0 40px rgba(255,214,80,.35); animation: girar 2.6s ease-in-out infinite; margin-bottom: 18px; }
      #rotate .ico::before { content: ""; position: absolute; inset: 9px 6px 14px 6px; border-radius: 4px; background: #3e8e5e; }
      #rotate .ico::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 14px; height: 3px; margin-left: -7px; border-radius: 2px; background: #ffd54f; }
      #rotTxt { font-size: 22px; color: #ffd54f; text-shadow: 0 2px 0 #3a1a00; max-width: 320px; line-height: 1.3; }
      @keyframes girar { 0%,22% { transform: rotate(0deg); } 52%,88% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
      /* 23/11: o jogo agora tem versao VERTICAL -- sem aviso de girar */
      #erro { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; background: #b71c1c; color: #fff; display: none; z-index: 20; font-size: 14px; }
    </style>
