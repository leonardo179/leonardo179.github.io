<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7D32">
<title>Mercado Gestor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercado Gestor">
<style>
  :root{
    --verde:#2E7D32; --verde-escuro:#1B5E20; --laranja:#F57C00; --vermelho:#D32F2F;
    --fundo:#F2F5F1; --card:#fff; --texto:#1F2A1F; --fraco:#6B7A6B; --divisor:#E1E7E0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--fundo); color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px}
  /* respeita o entalhe do iPhone */
  header{background:linear-gradient(135deg,var(--verde-escuro),var(--verde)); color:#fff;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 16px; display:flex; align-items:flex-start; gap:12px}
  header .voltar{font-size:26px; line-height:1; cursor:pointer; user-select:none; padding-top:2px}
  header h1{margin:0; font-size:21px}
  header .sub{color:#CFEBD0; font-size:12px; margin-top:2px}
  header .acao{background:rgba(255,255,255,.18); border-radius:12px; padding:8px 12px;
    font-size:13px; cursor:pointer; white-space:nowrap}
  main{padding:10px 10px calc(env(safe-area-inset-bottom) + 90px)}

  .resumo{display:flex; gap:6px; margin-top:14px}
  .resumo div{flex:1; background:rgba(255,255,255,.14); border-radius:12px; padding:10px; cursor:pointer}
  .resumo b{display:block; font-size:22px}
  .resumo span{font-size:11px; color:#CFEBD0}
  .conexao{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:11px; color:#CFEBD0}

  .grade{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .modulo{background:var(--card); border-radius:16px; padding:14px; min-height:112px;
    box-shadow:0 1px 3px rgba(0,0,0,.12); cursor:pointer; position:relative}
  .modulo .ic{font-size:30px}
  .modulo h3{margin:8px 0 2px; font-size:17px}
  .modulo p{margin:0; font-size:13px; color:var(--fraco)}
  .selo{position:absolute; top:12px; right:12px; color:#fff; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:14px}

  .cartao{background:var(--card); border-radius:14px; margin:10px 0; overflow:hidden;
    display:flex; box-shadow:0 1px 3px rgba(0,0,0,.10)}
  .faixa{width:7px; flex:none}
  .corpo{padding:12px; flex:1; min-width:0}
  .linha{display:flex; align-items:center; gap:8px}
  .titulo{font-weight:700; font-size:17px; flex:1; min-width:0}
  .sub{font-size:13px; color:var(--fraco); margin-top:3px}
  .extra{font-size:13px; color:var(--fraco); margin-top:2px; white-space:pre-line}
  .destaque{margin-top:8px; padding:8px 10px; border-radius:14px; font-size:12.5px; white-space:pre-line}
  .botoes{margin-top:8px; display:flex; gap:14px; flex-wrap:wrap}
  .botoes button{background:none; border:0; font-size:13.5px; font-weight:700;
    text-transform:uppercase; padding:6px 0; cursor:pointer; color:var(--verde)}
  .botoes button.sec{color:var(--laranja)}

  label{display:block; font-size:11px; font-weight:700; color:var(--fraco);
    margin:14px 0 4px; text-transform:none}
  input,select,textarea{width:100%; padding:12px; font-size:15px; font-family:inherit;
    border:1px solid var(--divisor); border-radius:10px; background:#fff; color:var(--texto)}
  textarea{min-height:80px}
  .aviso{margin-top:12px; padding:10px 12px; border-radius:14px; font-size:13px; white-space:pre-line}
  .marcador{display:flex; align-items:center; gap:10px; margin-top:10px; font-size:15px}
  .marcador input{width:22px; height:22px; flex:none}

  .barra{position:fixed; left:0; right:0; bottom:0; background:#fff; display:flex; gap:8px;
    padding:10px 12px calc(env(safe-area-inset-bottom) + 12px); box-shadow:0 -2px 8px rgba(0,0,0,.08)}
  .barra button{flex:1; border:0; border-radius:14px; padding:14px; font-size:16px;
    font-weight:600; color:#fff; background:var(--verde); cursor:pointer}
  .barra button.cinza{background:#607D8B}
  .barra button.laranja{background:var(--laranja)}
  .barra button.vermelho{background:var(--vermelho)}

  .fab{position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom) + 18px);
    background:var(--laranja); color:#fff; border:0; border-radius:28px; padding:16px 22px;
    font-size:15px; font-weight:600; box-shadow:0 3px 10px rgba(0,0,0,.25); cursor:pointer}
  .vazio{text-align:center; color:var(--fraco); padding:40px 20px; white-space:pre-line}
  .rotulo-secao{font-size:12px; font-weight:700; color:var(--fraco); margin:20px 0 4px}
  .aviso-instalar{background:#fff; border-radius:14px; padding:14px; margin:10px 0;
    font-size:13px; color:var(--fraco); box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:100px; background:#263238;
    color:#fff; padding:12px 18px; border-radius:24px; font-size:14px; z-index:99; max-width:88%}

  /* Telas de marcar: o dedo so toca no quadradinho, sem teclado. */
  .topo-marcar{padding:10px 12px 0}
  .linha-marcar{display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px;
    padding:10px 12px; margin-bottom:6px; box-shadow:0 1px 3px rgba(0,0,0,.08); cursor:pointer}
  .linha-marcar input[type=checkbox]{width:24px; height:24px; flex:none}
  .linha-marcar .texto{flex:1; min-width:0}
  .linha-marcar .texto b{display:block; font-size:15px}
  .linha-marcar .texto small{color:var(--fraco); font-size:11px}
  .linha-marcar .qtd{font-weight:700; color:var(--verde); font-size:16px; padding:6px 12px;
    min-width:44px; text-align:right}
  .rodape-marcar{position:sticky; bottom:0; background:#fff; padding:10px 12px
    calc(env(safe-area-inset-bottom) + 12px); box-shadow:0 -2px 8px rgba(0,0,0,.08)}
  .rodape-marcar .contador{font-size:13px; color:var(--fraco); margin-bottom:8px}
  .rodape-marcar button{width:100%; border:0; border-radius:14px; padding:14px; font-size:16px;
    font-weight:600; color:#fff; background:var(--verde); cursor:pointer}
  .rodape-marcar button:disabled{opacity:.4}
  .linha-dia{background:#fff; border-radius:14px; padding:10px 12px; margin-bottom:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* Painel do dono: cada bloco e uma pergunta respondida com barras. */
  .bloco-dash{background:#fff; border-radius:14px; padding:12px; margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .bloco-dash .cabeca{display:flex; align-items:center; gap:10px; cursor:pointer;
    padding-bottom:10px; border-bottom:1px solid #EEF2EE; margin-bottom:10px}
  .bloco-dash .cabeca .ic{font-size:22px}
  .bloco-dash .cabeca div{flex:1; min-width:0}
  .bloco-dash .cabeca b{display:block; font-size:15px}
  .bloco-dash .cabeca small{color:var(--fraco); font-size:11px}
  .bloco-dash .cabeca .seta{color:var(--fraco); font-size:22px}
  .sub-bloco{font-size:11px; font-weight:700; color:var(--fraco); margin:14px 0 6px}
  .barra-linha{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .barra-linha .rot{flex:0 0 34%; font-size:12px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap}
  .barra-linha .trilho{flex:1; background:#EEF2EE; border-radius:8px; height:16px; overflow:hidden}
  .barra-linha .preenchida{height:100%; border-radius:8px; transition:width .3s}
  .barra-linha .val{flex:0 0 auto; font-size:11px; font-weight:700; color:var(--fraco);
    min-width:56px; text-align:right}
</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js?v=202607281845"></script>
</body>
</html>
