        box-shadow: 0 4px 0 #2a1708, 0 8px 18px rgba(0,0,0,.5), inset 0 2px 4px rgba(0,0,0,.6); }
      #ld-fill { height: 100%; width: 0%; border-radius: 9px; transition: width .2s ease-out;
        background: linear-gradient(#ffe57a, #ffc021 55%, #f39a10); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 0 10px rgba(255,200,40,.6); }
      #ld-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
        color: #fff; text-shadow: 0 1px 0 #3b2410, 0 0 4px #3b2410; letter-spacing: .5px; }
      #ld-tip { margin-top: 12px; font-size: clamp(13px, 1.9vh, 17px); font-weight: 600; color: #fff3cf; text-shadow: 0 2px 3px rgba(0,0,0,.9);
        min-height: 1.4em; transition: opacity .35s; }
      #ld-tip b { color: #ffd54f; }
      #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: rgba(18,13,30,.95); z-index: 10; text-align: center; padding: 24px; box-sizing: border-box; font-size: 20px; }
      #rotate .ico { font-size: 64px; animation: girar 1.8s ease-in-out infinite; }
      @keyframes girar { 0%,20% { transform: rotate(0deg); } 60%,100% { transform: rotate(-90deg); } }
      /* 16/11: o jogo agora tem versao VERTICAL -- o aviso de girar e' desenhado pelo proprio jogo, so' nas telas ainda sem layout em pe' */
      #erro { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; background: #b71c1c; color: #fff; display: none; z-index: 20; font-size: 14px; }
    </style>
